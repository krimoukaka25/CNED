<!DOCTYPE html>

<head>

<title>TAQADDUM — Espace décideur CNED</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16221c;--mu:#5d6c63;--ln:#e0e8e3;--g:#0b5d3b;--gt:#e5f3ec;--r:#c8102e;--rt:#fde7eb;--a:#9a5a00;--at:#fff1d6;--bl:#2f6f9a;--bt:#e3eef6;--sb:#0c3a28;--sbt:#cfe3d8;--on:#fff;--sh:0 1px 2px rgba(10,40,25,.06),0 4px 14px rgba(10,40,25,.05);--land:#eaf1ed;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16201b;--ink:#e6efe9;--mu:#9bada2;--ln:#273730;--g:#4cc38a;--gt:#183a2b;--r:#ff7089;--rt:#40202a;--a:#f2b24a;--at:#3b2d12;--bl:#6fb0dd;--bt:#14283a;--sb:#09130f;--sbt:#a9c2b4;--on:#06150e;--sh:none;--land:#1c2a23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#16201b;--ink:#e6efe9;--mu:#9bada2;--ln:#273730;--g:#4cc38a;--gt:#183a2b;--r:#ff7089;--rt:#40202a;--a:#f2b24a;--at:#3b2d12;--bl:#6fb0dd;--bt:#14283a;--sb:#09130f;--sbt:#a9c2b4;--on:#06150e;--sh:none;--land:#1c2a23;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--sb);color:var(--sbt);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column}
.br{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}.br b{display:block;color:#fff;font-size:17px}.br span{font-size:11px;opacity:.75}
aside button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--sbt);font:inherit;font-weight:600;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px}
aside button small{display:block;font-weight:400;opacity:.7;font-size:11px}aside button.on{background:rgba(255,255,255,.14);color:#fff}aside button:hover{background:rgba(255,255,255,.08)}
.ft{margin-top:auto;font-size:10.5px;opacity:.7;padding:0 8px}.wrap{min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--ln);padding:14px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.top h1{font-size:19px;margin:0}.top small{color:var(--mu);display:block;font-size:11.5px}.pill{background:var(--at);color:var(--a);font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px}
main{padding:20px 28px 44px;max-width:1260px}h2{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--g);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.gk{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--g);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}.k.r{border-left-color:var(--r)}.k.a{border-left-color:#e8a317}.k.n{border-left-color:var(--ln)}
.k .l{font-size:10.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}.k .v{font-size:24px;font-weight:800;margin:3px 0}.k .v span{font-size:12px;color:var(--mu);font-weight:600;margin-left:4px}.k .s{font-size:11px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mu{color:var(--mu);font-size:11.5px}.ht{font-size:11px;color:var(--mu);margin:10px 0 0}
.bar{margin:9px 0}.bl{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}.tr{height:9px;background:var(--ln);border-radius:9px;overflow:hidden}.tr i{display:block;height:100%;background:var(--g);border-radius:9px}.tr i.r{background:var(--r)}.tr i.a{background:#e8a317}.tr i.b{background:var(--bl)}
.tg{font-style:normal;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gt);color:var(--g);white-space:nowrap}.tg.r{background:var(--rt);color:var(--r)}.tg.a{background:var(--at);color:var(--a)}.tg.b{background:var(--bt);color:var(--bl)}.tg.n{background:var(--ln);color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:8px;border-bottom:2px solid var(--ln);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--gt)}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.it{padding:9px 0;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px}.it:last-child{border:0}.it b{display:block}
.btn{border:1px solid var(--g);background:var(--g);color:var(--on);padding:7px 13px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.btn.o{background:transparent;color:var(--g)}.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--ln)}.tabs button{border:0;background:transparent;color:var(--mu);font:inherit;font-weight:700;padding:9px 13px;cursor:pointer;border-bottom:3px solid transparent}.tabs button.on{color:var(--g);border-color:var(--g)}
.ban{background:var(--sb);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px}.ban h3{margin:4px 0 6px;font-size:18px}.ban p{margin:0;opacity:.9;max-width:880px}.ban small{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7;font-weight:700}
.map{width:100%;height:auto;background:var(--bg);border-radius:12px}.map path{fill:var(--land);stroke:var(--ln);stroke-width:1.5}.map circle{cursor:pointer;stroke:var(--card);stroke-width:2}.map text{fill:var(--mu);font-size:10px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin:9px 0 4px}select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
@media (max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}.br,.ft,aside button small{display:none}aside button{width:auto;white-space:nowrap;margin:0}.g2,.g2e{grid-template-columns:1fr}.top,main{padding-left:16px;padding-right:16px}}
@media print{aside,.btn,.tabs{display:none}body{display:block;background:#fff}}
</style>

<script>
const f=(n,d=1)=>n==null?'—':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const K=(l,v,u,s,c='')=>`<div class="k ${c}"><div class="l">${l}</div><div class="v">${v}<span>${u}</span></div><div class="s">${s}</div></div>`;
const B=(l,p,c='',t='')=>`<div class="bar"><div class="bl"><span>${l}</span><b>${t||f(p)+' %'}</b></div><div class="tr"><i class="${c}" style="width:${Math.max(0,Math.min(100,p))}%"></i></div></div>`;
const C=(t,b,h='')=>`<section class="card"><h2>${t}</h2>${b}${h?`<p class="ht">${h}</p>`:''}</section>`;
const T=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`;
const G=(l,v)=>`<div class="it"><span class="mu">${l}</span><b style="text-align:right">${v}</b></div>`;

// slug,nom,secteur,wilaya,réf,lon,lat,AE initiale,AE actuelle,engagé,payé,physique,financier travaux,délai consommé,début,durée initiale,durée en vigueur,fin contractuelle,contractant,BET,BCS,marché travaux,avenant en attente,arrêt,constat,recommandation
const D=[
['djendjen','Pénétrante Djendjen – Autoroute Est-Ouest','Travaux publics','Jijel, Mila, Sétif','CNED-TP-001',5.8,36.8,90,214.375,210.824,136.73,62,61.32,91,'10/03/2014',36,138,'06/09/2026','Rizzani de Decher – MAPA – SAPTA (ETRHB remplacé)','SNC Lavalin – CTTP','EGIS – SAETI – LTPE',183.586,9.071,0,'Cadence améliorée depuis septembre 2023 ; expropriation et réseaux non achevés.','Achever la libération des emprises ; arrêter la consistance et le coût de la section PK 34–38.'],
['bejaia','Pénétrante Béjaïa – Autoroute Est-Ouest','Travaux publics','Béjaïa','CNED-TP-002',4.75,36.55,190,169.102,168.646,151.79,88.5,88.41,96,'18/12/2013',36,126,'27/12/2025','SAPTA – CRCC','Kyong Dong – Saman','Dar El Handassa – SETS – LCTP',140.929,5,0,'88 km sur 100 en service ; le raccordement au port dépend d’un tronçon de 11 km à emprise non libérée.','Achever la libération de l’emprise du premier tronçon.'],
['tizi','Pénétrante Tizi Ouzou – Autoroute Est-Ouest','Travaux publics','Tizi Ouzou, Bouira','CNED-TP-003',4.05,36.7,60,130.8,128.115,100.127,68,75.08,95.45,'03/03/2014',36,132,'13/01/2026','ENGOA – Özgun – Nurol','—','Italoconsult – CTTP',109.425,5.8,0,'Glissement de terrain du 25 février 2025 (PK 35+300).','Arrêter la solution de traitement du glissement pour permettre sa prise en charge.'],
['tenes','Pénétrante de Ténès (22 km)','Travaux publics','Chlef','CNED-TP-004',1.3,36.5,30,30,28.739,12.83,51,39.02,100,'29/03/2015',24,56,'Février 2020','ETRHB – Bouferradji – Teixeira Duarte (résilié)','SAETI – CTTP – LTPC','LCTP – LECACT',null,0,1,'Chantier à l’arrêt depuis juin 2021 ; marché résilié à l’amiable le 24/02/2025.','Préserver les travaux réalisés, relancer le reste à réaliser et achever le déplacement des réseaux.'],
['guelma','Pénétrante Guelma – Autoroute Est-Ouest','Travaux publics','Guelma','CNED-TP-005',7.43,36.46,35,35,9.626,9.282,22,88.26,100,'18/01/2015',24,48,'24/09/2019','ENGOA – EPTP Constantine – SATRPB – KOU GC (résilié)','SETS – Global Via – SETIA – ICA','LTPE – SETA – TEC4',null,0,1,'Marché résilié aux torts du groupement le 04/02/2024 ; appel d’offres du lot 2 infructueux.','Préserver les travaux réalisés et relancer les travaux restants.'],
['benimansour','Doublement ligne Béni Mansour – Béjaïa','Travaux publics','Bouira, Béjaïa','CNED-TP-006',4.6,36.15,65,74,66.517,21.293,28.45,14.38,100,'18/06/2014',60,118,'12/06/2025','Cosider TP & OA – Infrarail – Estel','Getinsa – Setirail – SAETI','Setirail – SAETI – Sidem',73.369,0,0,'Arrêt de plus de quatre ans (opposition des expropriés) ; emprise non totalement libérée.','Libérer totalement l’emprise avec les autorités locales et les gestionnaires de réseaux.'],
['tlelat','Ligne Oued Tlélat – Tlemcen','Travaux publics','Oran, Tlemcen','CNED-TP-007',-1,35.15,49.84,203.938,203.746,167.048,83.74,76.36,100,'09/08/2008',39,166.5,'15/06/2025','Condotte – Rizzani de Eccher','Condotte – Rizzani de Eccher (APD)','TPF Planege – Getinsa – SAETI',153.102,0,0,'Relance depuis octobre 2023 ; travaux à l’entrée de Tlemcen (2 km) non entamés.','Prendre les dispositions avec la SNTF et les autorités locales pour lancer les travaux à l’entrée de Tlemcen.'],
['akkid','Ligne Tlemcen – Akkid Abbes','Travaux publics','Tlemcen','CNED-TP-008',-1.7,34.75,80,127.2,121.223,26.502,8,5.55,99.71,'20/03/2013',48,93,'—','ETRHB – MAPA','—','TPF Planège – Getinsa-Payma – SAETI',null,0,1,'Ordre de service d’arrêt notifié le 17/06/2021 (situation de l’entreprise chef de file).','Aucune recommandation dans la fiche CNED.'],
['boukhroufa','Barrage de Boukhroufa','Hydraulique','El Tarf','CNED-HY-001',8.2,36.7,9,22.077,21.266,16.542,80,73.11,87,'29/10/2013',45,118,'—','Nurol – Gesi TP','ENHYD (études, 1996)','ENM – CTH – ENB',null,0,1,'À l’arrêt depuis le 03/11/2022 ; le groupement refuse la reprise pour créances impayées.','Aucune recommandation dans la fiche CNED.'],
['tleta','Barrage de Souk Tleta','Hydraulique','Tizi Ouzou','CNED-HY-002',3.85,36.52,11,34.326,32.61,26.257,88,68,100,'15/05/2012',40,107,'Novembre 2024','Nurol – Ozaltin','—','Tractebel',13.005,0.608,0,'Mise en eau conditionnée par les déviations RN 25 et CW 128 et par le viaduc ; marché ajourné faute de couverture financière.','Aucune recommandation dans la fiche CNED.'],
['chu','CHU de 400 lits à Ouargla','Habitat, urbanisme et ville','Ouargla','CNED-HU-001',5.33,31.95,null,25,24.003,5.628,17,20.27,42,'14/02/2024',36,36,'13/03/2027','Cosider Construction','Zerarga Hocine (maîtrise d’œuvre)','Zerarga Hocine (suivi)',23.263,0,0,'Démarrage effectif sept mois après l’ordre de service (main-d’œuvre, chaleur, granulats).','Instruire l’entreprise à renforcer ses moyens et à lancer à temps les appels d’offres de sous-traitance.']];
const P=Object.fromEntries(D.map(p=>[p[0],p]));
const sum=i=>D.reduce((s,p)=>s+(p[i]||0),0);
const wavg=i=>D.reduce((s,p)=>s+p[i]*p[8],0)/sum(8);
const ST=p=>p[23]?'arret':(p[13]-p[11]>=15||p[13]>=100)?'retard':'surveille';
const LB={arret:['À l’arrêt','r'],retard:['En retard','a'],surveille:['À surveiller','b']};
const tg=p=>`<em class="tg ${LB[ST(p)][1]}">${LB[ST(p)][0]}</em>`;
function al(p){const o=[],g=p[12]-p[11];
if(p[23])o.push([3,'Chantier à l’arrêt ou marché résilié','Décider du plan de relance du reste à réaliser']);
if(p[7]&&p[8]/p[7]>=2)o.push([p[8]/p[7]>=3?3:2,'Dérive de l’AE : × '+f(p[8]/p[7])+' depuis l’inscription','Examiner la consistance et les réévaluations successives']);
if(p[16]/p[15]>2)o.push([2,'Délai en vigueur : × '+f(p[16]/p[15])+' le délai initial','Vérifier les prolongations et leur part légitime']);
if(Math.abs(g)>=10&&!p[23])o.push([2,(g>0?'Paiements en avance de ':'Paiements en retard de ')+f(Math.abs(g),0)+' points sur les travaux',g>0?'Conditionner les prochains paiements à l’avancement':'Vérifier les situations de travaux impayées']);
if(p[22]>0)o.push([2,'Réévaluation ou avenant en attente : '+f(p[22],3)+' Md DA','Obtenir l’approbation ou fixer une date limite']);
return o}
const ALL=D.flatMap(p=>al(p).map(a=>[...a,p])).sort((a,b)=>b[0]-a[0]);

function map(){const X=lo=>(lo+9.2)*27,Y=la=>(37.4-la)*29;
const pts=[[-2.2,35.1],[-1,35.5],[-.6,35.8],[.3,36.1],[1.3,36.55],[3.05,36.85],[5.1,36.8],[6.9,36.95],[8.6,36.95],[8.2,36.5],[8.4,35.4],[7.7,34.2],[9,33],[9.6,30.3],[10,26.5],[9.6,24.9],[11.98,23.5],[8,21.9],[5.9,19.5],[4.25,19.15],[3.2,19.6],[1.2,21],[-1,22.8],[-4.8,25],[-8.7,27.3],[-8.7,28.7],[-7.4,29.4],[-5.6,30],[-3.7,30.9],[-2,32.1],[-1.2,32.6],[-1.7,33.3],[-1.7,34.6]];
const col={arret:'var(--r)',retard:'#e8a317',surveille:'var(--bl)'};
const cities=[['Alger',3.05,36.75],['Oran',-.64,35.7],['Constantine',6.6,36.37],['Ouargla',5.33,31.95],['Béchar',-5.3,31.6],['Tamanrasset',5.5,22.8]];
return `<svg class="map" viewBox="0 0 580 545"><path d="M${pts.map(p=>X(p[0]).toFixed(0)+','+Y(p[1]).toFixed(0)).join('L')}Z"/>${cities.map(c=>`<text x="${X(c[1])+6}" y="${Y(c[2])+3}">${c[0]}</text>`).join('')}${D.map(p=>`<circle cx="${X(p[5])}" cy="${Y(p[6])}" r="8" fill="${col[ST(p)]}" onclick="location.hash='projet-${p[0]}'"><title>${p[1]} — ${LB[ST(p)][0]}</title></circle>`).join('')}</svg><div class="lg">${Object.keys(LB).map(k=>`<span><i style="background:${col[k]}"></i>${LB[k][0]}</span>`).join('')}</div>`}

function vision(){const tap=wavg(11),taf=wavg(12),pay=sum(10),enp=sum(9)-pay,ar=D.filter(p=>ST(p)=='arret'),rt=D.filter(p=>ST(p)=='retard');
return `<div class="ban"><small>Lecture décisionnelle</small><h3>${ar.length} projets à l’arrêt et ${rt.length} en retard parmi les ${D.length} projets détaillés</h3><p>Au niveau global, paiements (${f(taf)} %) et avancement physique (${f(tap)} %) sont proches (${taf>=tap?'+':'−'}${f(Math.abs(taf-tap))} pt), mais cet équilibre masque des écarts de ${f(Math.min(...D.map(p=>p[12]-p[11])),0)} à +${f(Math.max(...D.map(p=>p[12]-p[11])),0)} points selon les projets. ${f(36.242,1)} Md DA d’avenants et de réévaluations attendent une approbation, et plus de ${f(enp,0)} Md DA d’engagements restent à payer.</p></div>
<div class="gk">${K('Autorisations d’engagement','6 539,3','Md DA','Portefeuille complet : 51 projets')}${K('À décaisser','~'+f(enp,0),'Md DA','Engagé non payé · '+D.length+' projets détaillés','a')}${K('Encaissé (payé)',f(pay,0),'Md DA',f(pay/sum(8)*100)+' % de leurs AE')}${K('Facturé en attente de paiement','—','','Situations de travaux à raccorder','n')}</div>
<div class="g2">${C('Avancement physique et financier',B('Avancement physique (pondéré par l’AE)',tap,'a')+B('Avancement financier (pondéré par l’AE)',taf)+`<div class="gk" style="margin:12px 0 0">${K('Écart global',(taf>=tap?'+':'−')+f(Math.abs(taf-tap)),'pts',Math.abs(taf-tap)<3?'Quasi nul, mais masque de fortes disparités':(taf>tap?'Paiements au-delà des travaux':'Paiements en deçà des travaux'),Math.abs(taf-tap)<3?'a':'r')}</div>`+'<h2 style="margin-top:14px">Écart par projet</h2>'+D.slice().sort((a,b)=>(b[12]-b[11])-(a[12]-a[11])).map(p=>B(p[1],Math.abs(p[12]-p[11])*1.2,p[12]>p[11]?'r':'b',(p[12]>p[11]?'+':'−')+f(Math.abs(p[12]-p[11]),0)+' pts')).join(''),'Écart = paiements sur travaux moins avancement physique. Barre rouge : paiements en avance ; bleue : paiements en retard.')}
${C('Les projets sur le territoire',map(),'Cliquez sur un point pour ouvrir la fiche du projet. Fond cartographique simplifié, positions indicatives.')}</div>
${C('Avenants et réévaluations prévus',T(['Projet','Objet','Montant (Md DA)','Situation'],[['Autoroute Est-Ouest, lot Est','Avenant n°05 — tunnel T1',4.163,'Approbation Gouvernement ou Conseil des ministres'],['Quatrième Rocade, lot 1','Avenant n°11 travaux, n°12–13 contrôle',6,'Approbation Gouvernement ou Conseil des ministres'],['Pénétrante Djendjen','Avenant n°14 travaux, n°08 contrôle',9.071,'Approbation Gouvernement ou Conseil des ministres'],['Pénétrante Béjaïa','Avenant n°11 contrôle, révisions de prix, pertes de change',5,'Approbation Gouvernement ou Conseil des ministres'],['Pénétrante Tizi Ouzou','Avenant n°12 travaux',5.8,'Approbation Gouvernement ou Conseil des ministres'],['Liaison Mascara','Avenant n°09, lot 2',5.6,'Approbation Gouvernement ou Conseil des ministres'],['Barrage de Souk Tleta','Avenant n°07 travaux',.608,'Reporté : manque de couverture financière'],['Ligne Boughezoul – Djelfa','Avenant n°13, prorogation de 3 mois',null,'Instruction à la Commission sectorielle des marchés'],['Ligne Saïda – Tiaret','Avenant n°14',null,'Visé avec réserves non suspensives']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num">${f(r[2],3)}</td><td>${r[3]}</td></tr>`).concat(`<tr><td colspan="2"><b>Total des montants connus</b></td><td class="num"><b>${f(36.242,3)}</b></td><td></td></tr>`)))}
<div class="g2e">${C('Principales alertes',ALL.slice(0,8).map(a=>`<div class="it"><div><b>${a[3][1]}</b><span class="mu">${a[1]} — <i>${a[2]}</i></span></div><em class="tg ${a[0]==3?'r':'a'}">${a[0]==3?'Critique':'Important'}</em></div>`).join(''),`${ALL.filter(a=>a[0]==3).length} alertes critiques et ${ALL.filter(a=>a[0]==2).length} importantes au total. Les alertes proviennent de règles lisibles : arrêt, dérive d’AE, dérive de délai, écart paiements/travaux, avenant en attente.`)}
${C('Projets à l’arrêt et en retard',T(['Projet','État','Physique','Délai consommé'],D.filter(p=>ST(p)!='surveille').sort((a,b)=>ST(a)<ST(b)?-1:1).map(p=>`<tr class="cl" onclick="location.hash='projet-${p[0]}'"><td><b>${p[1]}</b></td><td>${tg(p)}</td><td class="num">${f(p[11])} %</td><td class="num">${f(p[13])} %</td></tr>`)),'En retard : délai consommé de plus de 15 points au-dessus de l’avancement physique, ou délai entièrement consommé. Règle de lecture proposée, à valider.')}</div>`}

function liste(){return C('Portefeuille de projets',T(['Référence','Projet','Secteur','Wilaya','AE (Md DA)','Physique','Financier','Écart','État'],D.map(p=>`<tr class="cl" onclick="location.hash='projet-${p[0]}'"><td>${p[4]}</td><td><b>${p[1]}</b></td><td>${p[2]}</td><td>${p[3]}</td><td class="num">${f(p[8])}</td><td class="num">${f(p[11])} %</td><td class="num">${f(p[12])} %</td><td class="num"><b>${p[12]>=p[11]?'+':'−'}${f(Math.abs(p[12]-p[11]),0)}</b></td><td>${tg(p)}</td></tr>`)),'Codification des références proposée (secteur et numéro d’ordre). Cliquez sur un projet pour ouvrir sa fiche.')}

function fiche(slug,tab){const p=P[slug],g=p[12]-p[11],al_=al(p);
const eac=p[21]&&!p[23]?p[21]*p[12]/p[11]:null,rest=p[16]*(1-p[13]/100),obs=p[11]/(p[16]*p[13]/100),req=rest>.01?(100-p[11])/rest:null;
const tabs=[['apercu','Aperçu'],['finances','Finances'],['delais','Délais'],['documents','Documents'],['kpi','Autres indicateurs']];
const head=`<p><button class="btn o" onclick="location.hash='portefeuille'">← Portefeuille</button></p><div class="card"><div class="mu">${p[4]} · ${p[2]} · ${p[3]}</div><h1 style="margin:2px 0 8px">${p[1]}</h1>${tg(p)}</div><div class="tabs">${tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="location.hash='projet-${slug}-${t[0]}'">${t[1]}</button>`).join('')}</div>`;
let b='';
if(tab=='apercu')b=`<div class="gk">${K('Avancement physique',f(p[11]),'%','Travaux réalisés',g>=10?'a':'')}${K('Avancement financier',f(p[12]),'%','Paiements sur le marché travaux')}${K('Écart',(g>=0?'+':'−')+f(Math.abs(g)),'pts',g>0?'Paiements en avance':'Paiements en retard',Math.abs(g)>=10?'r':'')}${K('Délai consommé',f(p[13]),'%','Durée contractuelle',p[13]>=100?'r':'a')}${K('Décalage planning',f(p[13]-p[11],0),'pts','Délai consommé moins physique',p[13]-p[11]>=15?'r':'')}${K('Coût final probable',eac?f(eac):'—','Md DA',eac?'Marché travaux : '+f(p[21]):'Non calculable (arrêt ou résiliation)','n')}</div>
<div class="g2">${C('Acteurs du projet',T(['Rôle','Organisme','Responsable'],[['Maître d’ouvrage','<span class="mu">À renseigner</span>','<span class="mu">Nom à renseigner</span>'],['Bureau d’études (BET)',p[19],'<span class="mu">Nom à renseigner</span>'],['Organisme de contrôle (OC)','<span class="mu">À renseigner</span>','<span class="mu">Nom à renseigner</span>'],['Bureau de contrôle et suivi (BCS)',p[20],'<span class="mu">Nom à renseigner</span>'],['Contractant',p[18],'<span class="mu">Nom à renseigner</span>']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`)),'Les organismes viennent des fiches CNED ; les noms de responsables ne figurent pas dans le rapport et seront saisis dans la plateforme.')}
${C('Alertes du projet',al_.length?al_.map(a=>`<div class="it"><div><b>${a[1]}</b><span class="mu">${a[2]}</span></div><em class="tg ${a[0]==3?'r':'a'}">${a[0]==3?'Critique':'Important'}</em></div>`).join(''):'<p class="mu">Aucune alerte.</p>')}</div>
${C('Constat de la CNED',`<p style="margin-top:0">${p[24]}</p><p class="mu" style="margin-bottom:0"><b>Recommandation :</b> ${p[25]}</p>`)}`;
if(tab=='finances')b=`<div class="gk">${K('AE actuelle',f(p[8],3),'Md DA',p[7]?'Initiale : '+f(p[7],3)+' Md DA':'Initiale non renseignée')}${K('Dérive de l’AE',p[7]?'× '+f(p[8]/p[7]):'—','',p[7]?'Entre l’inscription et aujourd’hui':'','a')}${K('Engagé',f(p[9],3),'Md DA',f(p[9]/p[8]*100)+' % de l’AE')}${K('Payé',f(p[10],3),'Md DA',f(p[10]/p[8]*100)+' % de l’AE')}</div>
<div class="g2e">${C('Lecture financière',B('Engagé sur l’AE',p[9]/p[8]*100)+B('Payé sur l’AE',p[10]/p[8]*100,'b')+B('Avancement financier travaux',p[12])+B('Avancement physique',p[11],'a')+G('Reste à payer sur engagements',f(p[9]-p[10],3)+' Md DA')+G('Reste à payer sur l’AE',f(p[8]-p[10],3)+' Md DA'))}
${C('Coût final et avenants',G('Marché de travaux (après avenants)',p[21]?f(p[21],3)+' Md DA':'Non applicable')+G('Coût final probable',eac?f(eac,1)+' Md DA':'Non calculable')+G('Écart au marché',eac?((eac-p[21])>=0?'+':'−')+f(Math.abs(eac-p[21]),1)+' Md DA':'—')+G('Avenant ou réévaluation en attente',p[22]?f(p[22],3)+' Md DA':'Aucun'),'Coût final probable = marché × (paiements ÷ avancement physique), en supposant que la tendance actuelle se maintienne.')}</div>`;
if(tab=='delais')b=`<div class="gk">${K('Durée initiale',p[15],'mois','À la signature')}${K('Durée en vigueur',f(p[16],0),'mois','× '+f(p[16]/p[15])+' la durée initiale',p[16]/p[15]>2?'r':'')}${K('Délai consommé',f(p[13]),'%','Au 30/06/2025',p[13]>=100?'r':'a')}${K('Fin contractuelle',p[17],'','Date en vigueur')}</div>
${C('Cadence',B('Délai consommé',p[13],'b')+B('Avancement physique',p[11],'a')+G('Date de démarrage',p[14])+G('Cadence observée',f(obs)+' points d’avancement par mois')+G('Cadence requise pour finir dans le délai',req?f(req)+' points par mois':'Délai échu')+G('Rapport requis / observé',req?'× '+f(req/obs):'—'),req?'Une cadence requise très supérieure à la cadence observée signale un délai intenable sans mesure corrective.':'Le délai contractuel est entièrement consommé.')}`;
if(tab=='documents')b=C('Documents du projet',T(['Document','Détail','Disponibilité'],[['Marché de travaux',p[18]+(p[21]?' · '+f(p[21],3)+' Md DA':''),'<em class="tg">Dans le rapport</em>'],['Ordre de service de démarrage','Notifié le '+p[14],'<em class="tg">Dans le rapport</em>'],['Marché de contrôle et suivi',p[20],'<em class="tg">Dans le rapport</em>'],['Avenants',p[22]?'Avenant en attente : '+f(p[22],3)+' Md DA':'Liste à raccorder','<em class="tg a">À téléverser</em>'],['Procès-verbaux de réception','Provisoire et définitive','<em class="tg a">À téléverser</em>'],['Rapport CNED','Synthèse de suivi, septembre 2025 (situation au 30/06/2025)','<em class="tg">Dans le rapport</em>']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`)),'La consultation des pièces sera active quand elles seront téléversées dans la plateforme.');
if(tab=='kpi')b=`<div class="g2e">${C('Indicateurs disponibles',G('Rythme de paiement',f(p[10]/p[8]*100)+' % de l’AE')+G('Taux d’engagement',f(p[9]/p[8]*100)+' %')+G('Dérive de délai','× '+f(p[16]/p[15]))+G('Dérive de l’AE',p[7]?'× '+f(p[8]/p[7]):'—')+G('Efficacité des paiements',p[11]?f(p[11]/p[12],2)+' de travaux par dinar payé':'—'))}
${C('Indicateurs non encore alimentés',['Tenue des engagements hebdomadaires du chantier','Causes de non-réalisation et leur récurrence','Santé du contractant','Blocages ouverts et ancienneté','Fiabilité des preuves de terrain'].map(x=>`<div class="it"><span>${x}</span><em class="tg n">À alimenter</em></div>`).join(''),'Ces données viennent du suivi terrain et du maître d’ouvrage, pas du rapport CNED.')}</div>`;
return head+b}

const J=[];
const ACT=[['djendjen','Libérer les emprises restantes','Autorités locales, gestionnaires de réseaux'],['djendjen','Arrêter la consistance et le coût de la section PK 34–38','Maître d’ouvrage'],['bejaia','Libérer l’emprise du tronçon de 11 km','Autorités locales'],['tizi','Arrêter la solution de traitement du glissement','Maître d’ouvrage et BET'],['tenes','Relancer le reste à réaliser et achever le déplacement des réseaux','Maître d’ouvrage'],['guelma','Relancer les travaux restants (lot 2 infructueux)','Maître d’ouvrage'],['tlelat','Lancer les travaux d’entrée de Tlemcen avec la SNTF','SNTF, autorités locales'],['benimansour','Libérer totalement l’emprise','Autorités locales, gestionnaires de réseaux'],['chu','Renforcer l’organisation du chantier et lancer les appels d’offres de sous-traitance','Contractant']];
const jr=()=>J.length?T(['Date','Projet','Destinataire','Type','Objet','État'],J.map(j=>`<tr><td>${j[0]}</td><td>${j[1]}</td><td>${j[2]}</td><td>${j[3]}</td><td>${j[4]}</td><td><em class="tg b">Enregistré</em></td></tr>`)):'<p class="mu">Aucun échange enregistré pour le moment.</p>';
function suivi(){return `<div class="g2">${C('Actions demandées aux parties prenantes',T(['Projet','Action','Destinataire','Échéance','Suivi'],ACT.map((a,i)=>`<tr><td><b>${P[a[0]][1]}</b></td><td>${a[1]}</td><td>${a[2]}</td><td><em class="tg n">À fixer</em></td><td><button class="btn o" onclick="pre(${i})">Préparer</button></td></tr>`)),'Actions tirées des recommandations de la CNED. Le bouton Préparer pré-remplit le message.')}
${C('Nouveau message',`<label>Projet</label><select id="mp">${D.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select><label>Destinataire</label><select id="md">${['Maître d’ouvrage','Bureau d’études','Organisme de contrôle','Bureau de contrôle et suivi','Contractant','Autorités locales','Gestionnaires de réseaux','Ministère de tutelle'].map(x=>`<option>${x}</option>`).join('')}</select><label>Type</label><select id="mt"><option>Demande de situation</option><option>Relance</option><option>Notification de décision</option><option>Convocation de réunion</option></select><label>Objet</label><input id="mo"><label>Message</label><textarea id="mm" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="send()">Enregistrer et envoyer (démonstration)</button>`,'Aucun message n’est réellement envoyé dans ce prototype.')}</div>
${C('Journal des échanges',`<div id="jr">${jr()}</div>`,'Chaque échange est rattaché à un projet et à une partie prenante, pour garder une trace opposable.')}`}
function pre(i){const a=ACT[i];document.getElementById('mp').value=a[0];document.getElementById('mo').value=a[1];document.getElementById('mm').value='Pour mise en œuvre : '+a[1]+'. Merci de nous communiquer l’état d’avancement et la date prévue de levée.';document.getElementById('md').selectedIndex=a[2].startsWith('Autorités')?5:a[2].startsWith('Contractant')?4:0;document.getElementById('mo').scrollIntoView({block:'center'})}
function send(){const o=document.getElementById('mo').value.trim();if(!o)return;J.unshift([new Date().toLocaleDateString('fr-FR'),P[document.getElementById('mp').value][1],document.getElementById('md').value,document.getElementById('mt').value,o]);document.getElementById('jr').innerHTML=jr();document.getElementById('mo').value='';document.getElementById('mm').value=''}

const M={vision:['1 · Vision globale','Décider : engagements, avancement, alertes',vision],portefeuille:['2 · Portefeuille','Fiche technique de chaque projet',liste],suivi:['3 · Suivi et communication','Parties prenantes, actions et échanges',suivi]};
const nav=document.getElementById('nav'),app=document.getElementById('app');
nav.insertAdjacentHTML('beforeend',Object.keys(M).map(k=>`<button data-k="${k}">${M[k][0]}<small>${M[k][1]}</small></button>`).join('')+'<div class="ft">Prototype · données du rapport CNED, juin 2025</div>');
function show(){const q=location.hash.slice(1).split('-');let k=M[q[0]]?q[0]:q[0]=='projet'&&P[q[1]]?'portefeuille':'vision',t,s,h;
if(q[0]=='projet'&&P[q[1]]){t=P[q[1]][1];s='Fiche projet';h=fiche(q[1],q[2]||'apercu')}else{t=M[k][0];s=M[k][1];h=M[k][2]()}
document.getElementById('ttl').textContent=t;document.getElementById('sub').textContent=s;app.innerHTML=h;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));window.scrollTo(0,0)}
nav.onclick=e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.k};
window.addEventListener('hashchange',show);show();
</script>
</body>
</html>
